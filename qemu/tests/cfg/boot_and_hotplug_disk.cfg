# Configuration for the boot_and_hotplug_disk.py test

[DEFAULT]
# Standard VM parameters
# main_vm: vm1 (usually set by the job environment)
# os_type: linux # or windows
# login_timeout: 240

# Hotplug disk parameters
# The tag 'hp_disk0' is used in the test script (params.get("hotplug_image_tag", "hp_disk0"))
# It refers to an image object defined here.
images: %(boot_image)s hp_disk0

# Parameters for the boot image (replace with actual boot image details)
# boot_image.image_name: "rhel9.qcow2"
# boot_image.image_format: "qcow2"
# boot_image.disk_interface: "virtio-blk-pci"
# boot_image.boot_disk: True

# Parameters for the disk to be hotplugged (hp_disk0)
hp_disk0.image_name: "hotplug_disk.qcow2"
hp_disk0.image_size: "512M"  # Small size for testing
hp_disk0.image_format: "qcow2" # qcow2 is flexible
hp_disk0.disk_interface: "virtio-blk-pci" # Common, good performance
# hp_disk0.serial: "HP_DISK_001" # Optional: if you need to identify by serial

# Optional: Disk operation command
# This command is executed on the guest after the disk is hotplugged.
# For Linux, %s will be replaced with the device name (e.g., sdb).
# disk_op_cmd: "dd if=/dev/zero of=/dev/%s bs=1M count=10 conv=fsync"

# For Windows, the command needs to identify and use the new disk.
# This might involve finding the right disk index or drive letter.
# Example (conceptual, assumes new disk becomes D: and is formatted):
# disk_op_cmd: "cmd /c echo test > D:\\testfile.txt && type D:\\testfile.txt"
# A more robust Windows command might use diskpart or PowerShell to prepare the disk first
# if a raw disk image is used. If using a pre-formatted image, it might be simpler.
# disk_op_timeout: 360 # Timeout for the disk operation command

[vm1]
# Example override for a specific VM, if needed.
# os_type: linux

# --- Example Test Cases ---

[test_linux_virtio_blk]
main_vm: vm1
os_type: linux
# Assuming boot_image is defined in the main job YAML or a common cfg
hotplug_image_tag: hp_disk0
# hp_disk0 parameters are taken from DEFAULT unless overridden here

# Example I/O command for Linux
disk_op_cmd: "dd if=/dev/urandom of=/dev/%s bs=1M count=5 conv=fsync && sync"

[test_windows_virtio_blk]
main_vm: vm1
os_type: windows
# Assuming boot_image is defined in the main job YAML or a common cfg
hotplug_image_tag: hp_disk0
# hp_disk0 parameters are taken from DEFAULT unless overridden here

# Example I/O command for Windows (assumes disk is auto-mounted or prepared)
# This is a very basic example. Windows disk handling can be complex.
# It might require formatting, assigning a drive letter, etc.,
# which this simple command does not do.
# A common approach is to use a pre-formatted VHDX/QCOW2 for Windows hotplug.
# disk_op_cmd: "powershell -Command \"Get-Disk | Where-Object IsSystem -eq $false | Select-Object -First 1 | Set-Disk -isoffline $false; Get-Disk | Where-Object IsSystem -eq $false | Select-Object -First 1 | Initialize-Disk -PartitionStyle MBR -PassThru | New-Partition -AssignDriveLetter -UseMaximumSize | Format-Volume -FileSystem NTFS -Confirm:$false; echo 'test' > (Get-Partition | Where-Object DriveLetter -ne $null | Select-Object -Last 1).DriveLetter+':\\test.txt'\""
# The above is a complex one-liner, might be better to use a script in the guest or more specific utils.
# For now, let's leave it commented or simplified. Users should provide a suitable command.
# disk_op_cmd: "echo Please configure a suitable disk_op_cmd for Windows"
disk_op_timeout: 600

[test_linux_scsi_hd]
main_vm: vm1
os_type: linux
hotplug_image_tag: hp_scsi_disk
hp_scsi_disk.image_name: "hotplug_scsi_disk.qcow2"
hp_scsi_disk.image_size: "256M"
hp_scsi_disk.image_format: "qcow2"
hp_scsi_disk.disk_interface: "scsi-hd" # Using SCSI
disk_op_cmd: "dd if=/dev/urandom of=/dev/%s bs=1M count=5 conv=fsync && sync"

# Note: Actual boot_image parameters (like its name) should be provided by
# the test execution environment (e.g. job's YAML file) or a more global config.
# This file primarily focuses on the parameters specific to this test.
# The 'images: %(boot_image)s hp_disk0' line assumes 'boot_image' is a variable
# passed from such an environment, which is common in this test framework.
# If boot_image needs to be fully defined here, its parameters would be added
# similar to hp_disk0.
# Example for a self-contained boot_image definition:
# boot_image_name: "guest_os.qcow2"
# images: %(boot_image_name)s hp_disk0
# boot_image_name.image_format: "qcow2"
# boot_image_name.disk_interface: "virtio-blk-pci"
# boot_image_name.boot_disk: True
# (This is usually not done per-test-case like this but in a global config)

# For the test to run, ensure the image files (e.g., hotplug_disk.qcow2)
# are created or available to QEMU at runtime.
# The test script does not create these image files; it only defines them for QEMU.
# qemu-img create -f qcow2 hotplug_disk.qcow2 512M
# qemu-img create -f qcow2 hotplug_scsi_disk.qcow2 256M
# (These commands would be run on the host before starting the test)
